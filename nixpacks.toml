[phases.setup]
nixPkgs = ["python311", "bun"]

[phases.install]
cmds = [
  "cd frontend && bun install",
  "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = ["cd frontend && bun run build"]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips=\"*\""
